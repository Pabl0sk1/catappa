<link rel="shortcut icon" href="favicon.ico">
<script>
  /* la app se llamaba Forja: sus datos locales (sesión, tema, sonido, progreso) pasan a claves catappa-* */
  (function () {
    try {
      var viejas = [];
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("forja-") === 0) viejas.push(k); }
      viejas.forEach(function (k) {
        var n = "catappa-" + k.slice(6);
        if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k));
        localStorage.removeItem(k);
      });
    } catch (e) {}
  })();
  /* tema antes de pintar (evita el parpadeo). Predeterminado: el del sistema operativo.
     Solo con la sesión iniciada se puede elegir claro u oscuro (se guarda en la cuenta). */
  (function () {
    var t = "sistema";
    try { if (localStorage.getItem("catappa-token")) t = localStorage.getItem("catappa-tema") || "sistema"; } catch (e) {}
    var oscuro = t === "oscuro" || (t !== "claro" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", oscuro ? "dark" : "light");
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", oscuro ? "#0b1821" : "#f4f7f8");
  })();
</script>
