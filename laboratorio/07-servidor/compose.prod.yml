# =========================================================================
#  Stack "de produccion": nginx (reverse proxy) + API + Postgres
#  Dos redes: la base de datos queda AISLADA de internet.
#
#  Probarlo en local:
#     cd 07-servidor
#     docker compose -f compose.prod.yml up -d --build
#     curl http://localhost/api/tareas        <- entra por nginx, puerto 80
# =========================================================================

name: practica-prod

services:

  nginx:
    image: nginx:alpine
    container_name: prod-nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"                       # el UNICO puerto publicado al exterior
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    restart: unless-stopped
    logging:                          # evita que los logs llenen el disco
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../05-compose/app-tareas
    image: app-tareas:1.0.0
    # SIN container_name ni puerto fijo -> se puede escalar con --scale api=3
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tareas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tareas_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tareas_pass}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    expose:
      - "8080"                        # visible para nginx, NO para el host
    networks:
      - frontend                      # para que nginx la alcance
      - backend                       # para que alcance la base de datos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: prod-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tareas}
      POSTGRES_USER: ${POSTGRES_USER:-tareas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tareas_pass}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend                       # SOLO en la red interna
    restart: unless-stopped

volumes:
  pgdata_prod:

networks:
  frontend:
  backend:
    internal: true                    # sin salida a internet: aislamiento real
