# Nginx como REVERSE PROXY delante de la API.
# Este fichero se monta en /etc/nginx/conf.d/default.conf (solo lectura).

upstream api_backend {
    # "api" es el nombre del SERVICIO en compose: lo resuelve el DNS interno.
    server api:8080;
}

server {
    listen 80;
    server_name _;

    # Logs al stdout/stderr del contenedor (asi los ve "docker logs")
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Oculta la version de nginx en las cabeceras
    server_tokens off;

    location /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://api_backend;

        # Cabeceras para que la app sepa quien es el cliente real
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
