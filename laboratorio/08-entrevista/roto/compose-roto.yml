# Valídalo con:  docker compose -f compose-roto.yml config
# Soluciones en escenarios-debug.md (escenario 8).

version: "3.8"

services:

  api:
    build: ./app
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tareas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      - db

  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
	POSTGRES_PASSWORD: admin123
    volumes:
      - ./datos:/var/lib/postgresql/data
