spring.application.name=app-tareas
server.port=${SERVER_PORT:8080}

# Toda la configuracion viene de variables de entorno (12-factor app).
# Fijate en el host "db": es el NOMBRE DEL SERVICIO en compose.yml, no una IP.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/tareas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tareas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tareas_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
