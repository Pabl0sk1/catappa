spring.application.name=app-simple
server.port=${SERVER_PORT:8080}
app.mensaje=${APP_MENSAJE:Hola desde Docker}

# Apagado elegante: al recibir SIGTERM espera a terminar las peticiones en curso
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Exponemos /actuator/health para el HEALTHCHECK del Dockerfile
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
